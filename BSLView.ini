; BSLView - 1C:Enterprise BSL/OS Syntax Highlighting Plugin
; for Total Commander Lister (F3)

[Options]
; Font family for code display
FontFamily=Consolas, Courier New, monospace

; Font size in pixels
FontSize=14

; Tab size in spaces (for tab->space conversion)
TabSize=4

; Show line numbers
LineNumbers=1

; Theme: auto (follow TC), light (1C Configurator style), dark
Theme=auto

; Use Monaco Editor via WebView2 (1=yes, 0=use IE fallback)
UseMonaco=1

; Refuse files larger than this (MB) so Lister falls back to the built-in
; viewer instead of spending seconds building an editor model.
MaxFileSizeMB=64

; Keep one WebView2 instance resident between files. This is what makes F3
; open almost instantly; set to 0 to save roughly 150 MB of RAM instead.
KeepWarm=1

[Extensions]
; File extensions handled by this plugin
BSLExtensions=bsl;os
; Query language extensions
QueryExtensions=sdbl;query
; Other text/code extensions (Monaco built-in languages: markdown, json, xml, powershell, html)
TextExtensions=md;markdown;json;xml;ps1;psm1;psd1;html;htm
