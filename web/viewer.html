<div id="loading">Загрузка редактора…</div>
<div id="main" style="display:none">
<div id="topbar">
<button id="btn-save" class="tb-btn" title="Сохранить (Ctrl+S)" style="display:none"><svg class="tb-icon"><use href="#i-save"></use></svg></button>
<button id="btn-format" class="tb-btn" title="Форматировать документ (Alt+Shift+F)" style="display:none"><svg class="tb-icon"><use href="#i-format"></use></svg></button>
<button id="btn-comment" class="tb-btn" title="Комментировать строку (Ctrl+/)" style="display:none"><svg class="tb-icon"><use href="#i-comment"></use></svg></button>
<span class="tb-sep"></span>
<button id="btn-minimap" class="tb-btn" title="Показать/скрыть карту кода"><svg class="tb-icon"><use href="#i-map"></use></svg></button>
<span class="tb-sep"></span>
<button id="btn-theme" class="tb-btn" title="Переключить тему"><svg class="tb-icon"><use href="#i-moon"></use></svg></button>
<button id="btn-preview" class="tb-btn" title="Исходник и просмотр" style="display:none"><svg class="tb-icon"><use href="#i-window"></use></svg></button>
<button id="btn-edit" class="tb-btn" title="Редактировать (Ctrl+E)"><svg class="tb-icon"><use href="#i-pencil"></use></svg></button>
<span class="tb-sep"></span>
<button id="btn-pdf" class="tb-btn" title="Экспорт в PDF"><svg class="tb-icon"><use href="#i-pdf"></use></svg></button>
<span class="tb-sep"></span>
<button id="outline-toggle" class="tb-btn" title="Структура"><svg class="tb-icon"><use href="#i-outline"></use></svg></button>
</div>
<div id="workspace">
<div id="editor"></div>
<div id="preview-handle" title="Ширина панелей"></div>
<iframe id="preview" sandbox="allow-same-origin"></iframe>
<div id="form-preview" hidden></div>
<div id="outline-panel">
  <div id="resize-handle"></div>
  <div id="outline-content">
    <div id="outline-top">
      <div id="outline-header"><button id="sort-btn"><svg class="tb-icon"><use href="#i-sort-numbers"></use></svg></button><button id="outline-fold" title="Свернуть все процедуры и области">−</button><button id="outline-unfold" title="Развернуть все процедуры и области">+</button><span id="outline-count"></span></div>
      <div class="filter-wrap">
        <input id="outline-filter" type="text" placeholder="Фильтр…">
        <button id="filter-clear" title="Очистить">&times;</button>
      </div>
    </div>
    <div id="outline-list"></div>
  </div>
</div>
</div>
</div>
<div id="statusbar">
  <span id="sb-pos">Стр 1, Кол 1</span>
  <span id="sb-sel"></span>
  <span id="sb-lines">Строк: 0</span>
</div>
<iframe id="print-frame" sandbox="allow-same-origin"></iframe>
<div id="save-prompt" hidden>
  <div class="save-prompt-box">
    <div class="save-prompt-msg">Сохранить изменения?</div>
    <div class="save-prompt-btns">
      <button type="button" id="save-prompt-yes" class="save-prompt-yes">Сохранить</button>
      <button type="button" id="save-prompt-no">Не сохранять</button>
      <button type="button" id="save-prompt-cancel">Отмена</button>
    </div>
  </div>
</div>
